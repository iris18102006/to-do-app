<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasklane</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#2547b8">
<meta name="description" content="A small, fast to-do app with lists, priorities, due dates and notes. Built with TypeScript and Vite.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap">
</head>
<body>
<div class="shell">
  <nav id="side" aria-label="Views and lists"></nav>
  <div class="wrap">
    <div class="top">
      <h1 id="greet">Hello</h1>
      <p id="today"></p>
    </div>
    <div class="view"><h2 id="vtitle"></h2><span id="ptext"></span></div>
    <div class="bar"><div id="pfill"></div></div>
    <form id="add" autocomplete="off">
      <input id="a-title" type="text" placeholder="Add a task (press n)" aria-label="New task" maxlength="200">
      <select id="a-list" aria-label="List"></select>
      <select id="a-pri" aria-label="Priority"></select>
      <input id="a-due" type="date" aria-label="Due date">
      <button class="go" type="submit">Add task</button>
    </form>
    <div class="tools">
      <input id="q" type="search" placeholder="Search tasks (press /)" aria-label="Search tasks">
      <select id="sort" aria-label="Sort tasks"></select>
    </div>
    <ul id="list"></ul>
  </div>
</div>
<div id="toast" hidden role="status"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
